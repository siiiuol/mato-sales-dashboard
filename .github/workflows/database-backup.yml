name: Dagelijkse databaseback-up

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      # Deze stap faalt met opzet in plaats van over te slaan.
      #
      # Hij waarschuwde eerst alleen en zette ready=false, waarna elke volgende
      # stap werd overgeslagen en de run groen eindigde. Resultaat: maanden
      # dagelijkse vinkjes van 4 tot 9 seconden zonder dat er ooit een back-up
      # gemaakt is. Een back-up die niet kan lopen moet luid stuk staan, want
      # een gemiste back-up merk je pas wanneer je hem nodig hebt.
      - name: Controleer configuratie
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Geen back-up gemaakt::Het secret BACKUP_DATABASE_URL ontbreekt, dus er is niets geback-upt. Zet hem bij Settings -> Secrets and variables -> Actions -> New repository secret, met de Postgres-verbindingsreeks van de productiedatabase (de directe verbinding, niet de pooler)."
            exit 1
          fi
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::warning::BLOB_READ_WRITE_TOKEN ontbreekt. De back-up loopt wel, maar blijft alleen 35 dagen als artifact bij deze run staan; er gaat niets naar blob-opslag."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Installeer back-upprogramma's
        run: sudo apt-get update && sudo apt-get install -y postgresql-client sqlite3
      - run: npm ci
      - run: npm run backup
      - uses: actions/upload-artifact@v4
        with:
          name: mato-database-backup-${{ github.run_id }}
          path: backups/
          retention-days: 35
          if-no-files-found: error
