name: Dagelijkse databaseback-up

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      # Deze stap faalt met opzet in plaats van over te slaan.
      #
      # Hij waarschuwde eerst alleen en zette ready=false, waarna elke volgende
      # stap werd overgeslagen en de run groen eindigde. Resultaat: maanden
      # dagelijkse vinkjes van 4 tot 9 seconden zonder dat er ooit een back-up
      # gemaakt is. Een back-up die niet kan lopen moet luid stuk staan, want
      # een gemiste back-up merk je pas wanneer je hem nodig hebt.
      - name: Controleer configuratie
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Geen back-up gemaakt::Het secret BACKUP_DATABASE_URL ontbreekt, dus er is niets geback-upt. Zet hem bij Settings -> Secrets and variables -> Actions -> New repository secret, met de Postgres-verbindingsreeks van de productiedatabase (de directe verbinding, niet de pooler)."
            exit 1
          fi
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::warning::BLOB_READ_WRITE_TOKEN ontbreekt. De back-up loopt wel, maar blijft alleen 35 dagen als artifact bij deze run staan; er gaat niets naar blob-opslag."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # pg_dump moet minstens zo nieuw zijn als de server, anders stopt hij met
      # "server version mismatch" en maakt hij geen enkele back-up. Het pakket
      # `postgresql-client` in ubuntu-latest is versie 16, terwijl de databanken
      # op dit account Postgres 17 draaien — dus halen we de client uit de
      # pakketbron van Postgres zelf. Nieuwer mag, ouder niet.
      - name: Installeer back-upprogramma's
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Het pakket installeren is niet genoeg: Debians pg_wrapper blijft de
          # oudste client kiezen, dus `pg_dump --version` meldde nog steeds 16.15
          # terwijl 17 er wel stond. Nagemeten op een testbranch. Daarom de map
          # van 17 vooraan in PATH zetten voor de volgende stappen.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Welke pg_dump gebruiken we
        run: |
          which pg_dump
          pg_dump --version
      - run: npm ci
      - run: npm run backup
      - uses: actions/upload-artifact@v4
        with:
          name: mato-database-backup-${{ github.run_id }}
          path: backups/
          retention-days: 35
          if-no-files-found: error
