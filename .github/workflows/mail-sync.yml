name: Mailsync elke 15 minuten

# Draait buiten Vercel om: een Hobby-account laat maar één cron per dag toe, en
# eens per dag ophalen betekent dat een antwoord van een prospect een dag lang
# onopgemerkt blijft. Het eindpunt zelf is hetzelfde; alleen de aanroeper zit hier.
#
# GitHub plant deze taak op drukke momenten later in dan gevraagd — reken op een
# kwartier tot soms een half uur, niet op de seconde.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      MATO_BASE_URL: ${{ secrets.MATO_BASE_URL }}
    steps:
      # Faalt met opzet in plaats van over te slaan: zie database-backup.yml.
      # Wordt een van deze twee secrets ooit gewist of geroteerd, dan moet de
      # mailsync stuk staan en niet een kwartierlijks leeg vinkje worden.
      - name: Controleer configuratie
        run: |
          missing=""
          [ -z "$CRON_SECRET" ] && missing="$missing CRON_SECRET"
          [ -z "$MATO_BASE_URL" ] && missing="$missing MATO_BASE_URL"
          if [ -n "$missing" ]; then
            echo "::error title=Mailsync niet gelopen::Ontbrekende secrets:$missing. Zet ze bij Settings -> Secrets and variables -> Actions. Zonder deze stap blijft een antwoord van een prospect onopgemerkt."
            exit 1
          fi

      - name: Postvakken bijwerken
        run: |
          status=$(curl -sS --max-time 120 -o /tmp/mail-sync.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$MATO_BASE_URL/api/cron/mail-sync")
          cat /tmp/mail-sync.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::Mailsync gaf HTTP $status"
            exit 1
          fi
