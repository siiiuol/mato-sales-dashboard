[project]
name = "mato-lead-bot"
version = "0.1.0"
description = "MATO lead intelligence bot — Phases 1–2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "uvicorn[standard]>=0.32.0",
  "starlette>=0.41.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "httpx>=0.28.0",
  "beautifulsoup4>=4.12.0",
  "selectolax>=0.3.27",
  "lxml>=5.3.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "rapidfuzz>=3.10.0",
  "jsonschema>=4.23.0",
  "psycopg[binary]>=3.2.0",
  "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "pytest>=8.3.0"]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mato-import-kbo = "lead_bot.jobs.import_kbo:main"
mato-seed-demo = "lead_bot.jobs.seed_demo:main"
mato-enrich = "lead_bot.jobs.enrich_pipeline:main"
mato-learning = "lead_bot.jobs.learning:main"
